<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>页面加载失败</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f7f8fa;
        color: #1f2329;
        font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      main {
        max-width: 420px;
        padding: 32px 24px;
        text-align: center;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 12px;
      }
      p {
        color: #646a73;
        line-height: 1.7;
        margin: 0 0 24px;
      }
      button {
        font: inherit;
        color: #fff;
        background: #3370ff;
        border: 0;
        border-radius: 6px;
        padding: 10px 20px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>页面加载失败</h1>
      <p>页面文件没有下载完整，可能是网络中断，或系统刚刚更新过。请重新加载。</p>
      <button type="button" onclick="window.location.reload()">重新加载</button>
    </main>
  </body>
</html>
