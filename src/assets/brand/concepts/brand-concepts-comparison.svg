<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img"><title>品牌三候选比较：推荐相伴，候选拥光、知音</title><rect width="1200" height="650" fill="#FCFAF7"/><text x="64" y="76" font-family="Microsoft YaHei,sans-serif" font-size="29" font-weight="600" fill="#29332F">心域智链 · 温暖、有陪伴感、偏人文</text><text x="64" y="111" font-family="Microsoft YaHei,sans-serif" font-size="15" fill="#56625C">校园心理支持的三种表达</text><g transform="translate(64 170)"><rect width="344" height="404" rx="16" fill="#FFFFFF" stroke="#604372" stroke-width="2"/><g transform="translate(92 42) scale(1.65)"><path d="M14 19C31 19 45 30 45 49V79C28 75 14 62 14 44Z" fill="#604372"/><path d="M54 79V49C54 31 67 20 82 17V41C82 61 72 74 54 79Z" fill="#E8B185"/><path d="M26 35C33 40 36 47 36 57" fill="none" stroke="#FFFFFF" stroke-opacity=".5" stroke-width="2" stroke-linecap="round"/></g><text x="28" y="253" font-family="Microsoft YaHei,sans-serif" font-size="25" font-weight="600" fill="#604372">相伴</text><text x="28" y="287" font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#29332F">同页同行</text><text x="28" y="320" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#56625C">两页之间，留一条向前的路。</text><text x="28" y="373" font-family="Microsoft YaHei,sans-serif" font-size="13" fill="#604372">推荐 · 书页与道路兼具校园识别</text></g><g transform="translate(440 170)"><rect width="344" height="404" rx="16" fill="#FFFFFF" stroke="#CFD6CE" stroke-width="1"/><g transform="translate(92 42) scale(1.65)"><path d="M20 77V44C20 25 32 14 48 14C64 14 76 25 76 44V55" fill="none" stroke="#604372" stroke-width="10" stroke-linecap="round"/><path d="M38 70C38 57 48 48 61 48C61 61 51 70 38 70Z" fill="#E8B185"/><path d="M36 82H76" fill="none" stroke="#604372" stroke-width="8" stroke-linecap="round"/></g><text x="28" y="253" font-family="Microsoft YaHei,sans-serif" font-size="25" font-weight="600" fill="#604372">拥光</text><text x="28" y="287" font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#29332F">安心停留</text><text x="28" y="320" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#56625C">开放的门廊，托住一束暖光。</text><text x="28" y="373" font-family="Microsoft YaHei,sans-serif" font-size="13" fill="#604372">可比较候选</text></g><g transform="translate(816 170)"><rect width="344" height="404" rx="16" fill="#FFFFFF" stroke="#CFD6CE" stroke-width="1"/><g transform="translate(92 42) scale(1.65)"><path d="M15 31C15 22 22 16 31 16H43V49C43 65 34 75 20 80V66C27 62 30 56 30 50H15Z" fill="#604372"/><path d="M81 65C81 74 74 80 65 80H53V47C53 31 62 21 76 16V30C69 34 66 40 66 46H81Z" fill="#E8B185"/></g><text x="28" y="253" font-family="Microsoft YaHei,sans-serif" font-size="25" font-weight="600" fill="#604372">知音</text><text x="28" y="287" font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#29332F">倾听回应</text><text x="28" y="320" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#56625C">你说的话，在这里获得回应。</text><text x="28" y="373" font-family="Microsoft YaHei,sans-serif" font-size="13" fill="#604372">可比较候选</text></g></svg>