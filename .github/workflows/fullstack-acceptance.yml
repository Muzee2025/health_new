name: Isolated full-stack acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify runner safety tests
        run: python -m unittest discover -s scripts/tests -p test_fullstack_verification.py -v
      - name: Verify transport CLI safety tests
        run: python -m unittest discover -s scripts/tests -p test_nginx_transport.py -v
      - name: Verify Docker Compose availability
        run: docker compose version
      - name: Run with synthetic accounts and a new isolated database
        run: python scripts/verify-fullstack.py --run --timeout 600
      - name: Verify HTTP and QA TLS streaming proxy
        run: python scripts/verify-nginx-transport.py --run
      - name: Upload sanitized stage summaries only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fullstack-stage-summary
          path: |
            tmp/healthnew-qa-*/summary.json
            tmp/healthnew-qa-*/nginx-transport-summary.json
          if-no-files-found: warn
          retention-days: 7
