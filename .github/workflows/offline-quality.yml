name: Offline quality checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      # Type check. Only the 612 lines of .ts under src/ are covered: the 27
      # single-file components are plain JS (none uses <script lang="ts">) and
      # vue-tsc is not installed, so .vue is outside tsc's view entirely. This
      # is a real gate for that 3.6% of the frontend, not a claim that the
      # frontend is type-safe.
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      # Chart fixture invariants: daily totals equal the sum of their parts, the
      # heatmap has exactly 28 cells, histogram bins meet without gaps and each
      # duration falls in exactly one of them, channel percentages sum to 100.
      # It imports only relative paths (no npm package, no browser, no network),
      # so it would run before `npm ci` too. It prints its JSON report to stdout
      # even when it fails, leaving `"status": "failed"` as the last line; the
      # exit code is the real signal, so read the log from the AssertionError
      # upwards. Note that `scripts/frontend-experience-checks.mjs` is NOT this
      # kind of checker: it exports a function that capture-w2-ui.mjs calls with
      # a live page, and needs playwright + sharp, so it cannot be gated here.
      - run: node scripts/check-chart-data.mjs
      - run: npm run assets:check
      - run: npm run assets:source-test
      - run: npm run assets:source-check
      # Runs copied scripts with stub modules; no browser, optional packages or
      # capture/build output is used. --check-deps must stop before main work.
      - run: node --test scripts/tests/optional-script-dependencies.test.mjs

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      - run: python -m pip install -r backend/requirements-test.txt
      # `scripts/` is included so the one-off document generators cannot decay
      # further. They were 667 issues, cleared by `ruff check --add-noqa` (525
      # directives, comments only: the AST of all 38 files is byte-identical
      # before and after). Deliberately not `ruff format`: scripts/tests/ asserts
      # on literal source text (test_fullstack_verification.py:99-105) and
      # reformatting breaks it. Treat these noqa lines as debt markers, not as
      # approval to write new code this way.
      - run: python -m ruff check backend/app backend/tests backend/scripts scripts
      # Every Python file, not two hand-picked ones. All 127 files under backend/
      # and scripts/ compile today, so this costs the same single step while it
      # now catches a syntax error anywhere in the tree. `compileall` exits 1 on
      # the first file it cannot compile (verified against a deliberately broken
      # module), so it fails the job exactly like py_compile did.
      - run: python -m compileall -q backend scripts
      # Repository hygiene: no secrets, no runtime state, no unexpected paths and
      # no new blobs over 2 MB. It was red before this step existed, which is why
      # nobody noticed. The oversized and pinned-database entries it accepts are
      # exact paths, so a new file of either kind still fails the job.
      - run: python scripts/check-repo.py
      # deploy/ had no gate at all, so a broken compose file could only be found
      # by hand. `config --quiet` parses and interpolates without starting
      # anything. Two details that are easy to get wrong:
      #   - docker-compose.tls.yml is an *override* layer; on its own it fails
      #     with "service frontend has neither an image nor a build context".
      #   - RUNTIME_ENV_FILE and TLS_CERT_DIR must be absolute paths, and the
      #     env file they point at has to exist even though the values are fake.
      #   - docker-compose.backend.yml hard-codes `env_file: ../../backend/.env`.
      #     That file is git-ignored, so a clean checkout does not have it and
      #     `config` fails with "env file ... not found" before reading anything
      #     else. An empty placeholder is enough: this step only parses the file,
      #     it never starts a container, so no real value is needed or written.
      - name: Validate compose files
        run: |
          printf 'DB_PASSWORD=ci-placeholder\n' > /tmp/ci-runtime.env
          mkdir -p /tmp/ci-tls
          [ -f backend/.env ] || : > backend/.env
          export RUNTIME_ENV_FILE=/tmp/ci-runtime.env
          export TLS_CERT_DIR=/tmp/ci-tls
          docker compose -f deploy/backend/docker-compose.backend.yml config --quiet
          docker compose -f deploy/fullstack/docker-compose.yml config --quiet
          docker compose -f deploy/fullstack/docker-compose.yml \
                         -f deploy/fullstack/docker-compose.tls.yml config --quiet
      - run: python scripts/run-backend-baseline.py
      # Every script test, not a hand-kept list of three: naming the files one by
      # one silently dropped test_synthetic_dialogues.py and
      # test_training_database.py, and any test added later would be skipped too.
      - run: python -m unittest discover -s scripts/tests -p "test_*.py" -v
