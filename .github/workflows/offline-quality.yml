name: Offline quality checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run assets:check
      - run: npm run assets:source-test
      - run: npm run assets:source-check

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      - run: python -m pip install -r backend/requirements-test.txt
      - run: python -m py_compile scripts/backup-restore-database.py backend/tests/test_backup_restore_database.py
      - run: python scripts/run-backend-baseline.py
      - run: python -m unittest discover -s scripts/tests -p test_ai_evaluation.py -v
      - run: python -m unittest discover -s scripts/tests -p test_fullstack_verification.py -v
      - run: python -m unittest discover -s scripts/tests -p test_nginx_transport.py -v
