# Ruff configuration for the FastAPI backend (Python 3.12).
# Ruff's built-in default select (E4, E7, E9, F) reports 617 issues on this tree;
# this config adds import sorting (I) and bugbear (B) on top, so it reports 744.
# `backend/app` is clean under this config; the remainder is almost entirely the
# one-off document-generation scripts under scripts/, which are not worth
# rewriting for style. Keep the selection pinned here and do not widen it to
# `--select ALL` (16889 issues) without a separate cleanup plan.
target-version = "py312"
line-length = 100

exclude = [
  ".venv",
  "venv",
  "node_modules",
  "tmp",
  "deliverables",
  "docs",
  "coverage",
  "dist",
  "backend/temp",
  "backend/runtime",
  "backend/uploads",
  "backend/diagnostics_output",
  "backend/chroma",
  "**/__pycache__",
]

[lint]
# B904/RSE/FURB were added after measuring them across backend/app,
# backend/tests, backend/scripts and scripts: B904 and RSE report 0 findings,
# FURB reported 6 (`re.I`/`re.M` aliases) which were rewritten to the long
# names. Everything here is a bug-class rule; the purely stylistic families
# (C4, PIE810, RET, SIM, PLW, N, A, PERF) stay out on purpose — they were
# measured at 8/4/8/31/37/30/5/8 findings and are not worth the churn.
select = ["E4", "E7", "E9", "F", "I", "B", "B904", "RSE", "FURB"]
# B008: FastAPI declares dependencies as `Depends()` in argument defaults.
ignore = ["B008"]

[lint.per-file-ignores]
"backend/tests/**" = ["B011"]
"**/__init__.py" = ["F401"]
# scripts/tests/fixtures/ holds source *snippets* cut out of real revisions, so
# the N+1 gate's regression tests do not depend on git history. They are inputs
# to an AST scan, not importable modules: names are undefined by design (F821)
# and the files are never executed. Checked by the gate's own tests instead.
"scripts/tests/fixtures/**" = ["F821", "F401", "F811", "E501"]

[lint.isort]
known-first-party = ["app"]

[format]
quote-style = "double"
indent-style = "space"
docstring-code-format = false
