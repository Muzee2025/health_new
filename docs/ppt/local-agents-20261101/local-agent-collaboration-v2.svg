<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">本地多智能体协作，统一字体居中版</title>
<desc id="desc">立项拟建方案。三套本地候选模型支撑六类任务角色，复用语言模型并按需调度。六个格子的文字统一为微软雅黑28像素、常规字重、水平居中且整组垂直居中。底部仅显示输出结果。模型未经本轮部署或效果验证。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#604372" stroke-width="1.5"/></marker></defs>
<rect x="0" y="0" width="1920" height="1080" fill="#FFFFFF"/>
<text x="960" y="60" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="400" fill="#29332F">本地多智能体协作（拟建）</text>
<text x="960" y="106" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="400" fill="#29332F">Windows · 双RTX 4070（每卡12GB）</text>
<text x="275" y="190" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="400" fill="#29332F">授权文本 / 本人记录</text>
<path d="M480 190L715 190" fill="none" stroke="#604372" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="740" y="155" width="440" height="70" rx="16" fill="#F7F3F8" stroke="none" stroke-width="1.5"/>
<text x="960" y="190" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="400" fill="#29332F">协调器</text>
<text x="1540" y="190" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="400" fill="#29332F">3套模型 · 6类专家任务</text>
<path d="M960 225L960 910" fill="none" stroke="#604372" stroke-width="2" marker-end="url(#arrow)"/>
<g data-role-card="true" data-x="80" data-y="270" data-width="800" data-height="170">
<rect x="80" y="270" width="800" height="170" rx="16" fill="#FFFFFF" stroke="#E3E8E1" stroke-width="1.5"/>
<text x="480" y="304" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="400" fill="#29332F">语义理解专家</text>
<text x="480" y="338" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="400" fill="#29332F">Qwen3-8B · 4bit量化</text>
<text x="480" y="372" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="400" fill="#29332F">任务：提取事件、时间、否定和原文片段</text>
<text x="480" y="406" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="400" fill="#29332F">输出：结构化事实＋原文引用</text>
</g>
<path d="M885 355L950 355" fill="none" stroke="#604372" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<g data-role-card="true" data-x="1040" data-y="270" data-width="800" data-height="170">
<rect x="1040" y="270" width="800" height="170" rx="16" fill="#FFFFFF" stroke="#E3E8E1" stroke-width="1.5"/>
<text x="1440" y="304" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="400" fill="#29332F">情绪线索专家</text>
<text x="1440" y="338" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="400" fill="#29332F">Qwen3-8B · 独立角色提示</text>
<text x="1440" y="372" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="400" fill="#29332F">任务：整理压力、睡眠等自述表达</text>
<text x="1440" y="406" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="400" fill="#29332F">输出：有依据的线索＋未知项</text>
</g>
<path d="M970 355L1035 355" fill="none" stroke="#604372" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
