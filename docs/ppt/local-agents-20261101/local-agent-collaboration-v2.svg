<text x="480" y="538" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="400" fill="#29332F">Qwen3-8B · 独立角色提示</text>
<text x="480" y="572" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="400" fill="#29332F">任务：识别绝对化等候选表达模式</text>
<text x="480" y="606" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="400" fill="#29332F">输出：待核验假设＋对应原文</text>
</g>
<path d="M885 555L950 555" fill="none" stroke="#604372" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<g data-role-card="true" data-x="1040" data-y="470" data-width="800" data-height="170">
<rect x="1040" y="470" width="800" height="170" rx="16" fill="#FFFFFF" stroke="#E3E8E1" stroke-width="1.5"/>
<text x="1440" y="504" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="400" fill="#29332F">纵向记录专家</text>
<text x="1440" y="538" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="400" fill="#29332F">Qwen3-Embedding-0.6B＋时间规则</text>
<text x="1440" y="572" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="400" fill="#29332F">任务：召回本人授权记录并按时间归并</text>
<text x="1440" y="606" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="400" fill="#29332F">输出：阶段记录时间线 / 资料不足</text>
</g>
<path d="M970 555L1035 555" fill="none" stroke="#604372" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<g data-role-card="true" data-x="80" data-y="670" data-width="800" data-height="170">
<rect x="80" y="670" width="800" height="170" rx="16" fill="#FFFFFF" stroke="#E3E8E1" stroke-width="1.5"/>
<text x="480" y="704" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="400" fill="#29332F">风险复核专家</text>
<text x="480" y="738" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="400" fill="#29332F">Qwen3-8B＋待审规则</text>
<text x="480" y="772" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="400" fill="#29332F">任务：核对矛盾、缺失与紧急线索</text>
<text x="480" y="806" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="400" fill="#29332F">输出：待人工核查事项，不自动定级</text>
</g>
<path d="M885 755L950 755" fill="none" stroke="#604372" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<g data-role-card="true" data-x="1040" data-y="670" data-width="800" data-height="170">
<rect x="1040" y="670" width="800" height="170" rx="16" fill="#FFFFFF" stroke="#E3E8E1" stroke-width="1.5"/>
<text x="1440" y="704" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="400" fill="#29332F">资源检索专家</text>
<text x="1440" y="738" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="400" fill="#29332F">Qwen3-Embedding-0.6B＋Qwen3-Reranker-0.6B</text>
<text x="1440" y="772" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="400" fill="#29332F">任务：召回并重排已审核的支持资料</text>
<text x="1440" y="806" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="400" fill="#29332F">输出：相关资料片段＋来源</text>
</g>
