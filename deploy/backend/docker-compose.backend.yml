services:
  health-new-backend:
    container_name: health-new-backend
    build:
      context: ../..
      dockerfile: deploy/backend/Dockerfile
    env_file:
      - ../../backend/.env
    ports:
      - "18080:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
